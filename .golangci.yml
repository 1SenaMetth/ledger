run:
  timeout: 5m

linters:
  enable:
    - errcheck        # unchecked errors
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose       # unclosed HTTP response bodies
    - contextcheck    # functions that should accept a context
    - errorlint       # correct use of errors.Is / errors.As and %w
    - gosec           # common security mistakes
    - noctx           # HTTP requests built without a context
    - rowserrcheck    # unchecked sql.Rows.Err
    - sqlclosecheck   # unclosed sql.Rows
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable:
      - shadow
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
