services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      # Log slow queries so you can find N+1s before a load test does.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2 adds Redpanda here. It speaks the Kafka protocol, runs as one
  # container, and starts in about two seconds:
  #
  # redpanda:
  #   image: redpandadata/redpanda:latest
  #   command:
  #     - redpanda start
  #     - --smp 1
  #     - --overprovisioned
  #     - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
  #     - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
  #   ports:
  #     - "9092:9092"

volumes:
  postgres_data:
